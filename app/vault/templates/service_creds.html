{% extends "base.html" %}
{% block content %}
<br>
<div class="container">

    <div class="card shadow mb-4">
        <div class="card-header py-3">
          <div class="row align-items-center">
            <div class="col-md-6">
              <h4 class="font-weight-bold text-primary mb-0">Service Credentials</h4>
            </div>
            <div class="col-md-6 text-right">
              <div class="dropdown">
                <button class="btn btn-primary dropdown-toggle" type="button" id="manageCredsBtn" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                  Add credentials
                </button>
                <div class="dropdown-menu dropdown-menu-right" aria-labelledby="manageCredsBtn" id="addCredsMenu">
                  <span class="dropdown-item text-muted small">Loading clouds...</span>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="card-body">
          <div class="table-responsive">
	    <table class="table table-bordered" width="100%" cellspacing="0" id="credsTable" style="vertical-align: middle;">
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Type</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="credsTableBody">
                <tr id="emptyRow">
                  <td colspan="3" class="text-center text-muted">No credentials configured yet.</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
    </div>

    <!-- Modal OpenStack Credentials -->
    <div class="modal fade" id="openstackModal" data-backdrop="static" data-keyboard="false" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title d-flex align-items-center">
              <img src="{{ url_for('static', filename='img/openstack-logo.png') }}" style="width:20px; height:20px; object-fit:contain;" class="mr-2" alt="OpenStack">
              OpenStack credentials
            </h5>
            <button type="button" class="close" data-dismiss="modal">&times;</button>
          </div>
          <div class="modal-body">
            <form id="openstackForm">
              <div class="form-group">
                <label for="openstack_name">Credential name</label>
                <input type="text" class="form-control" id="openstack_name" name="name" placeholder="e.g. garr_creds">
              </div>
              <hr>
              <div class="form-group">
                <label for="openstack_app_credential_id">Application credential ID</label>
                <input type="text" class="form-control" id="openstack_app_credential_id" name="openstack_app_credential_id">
              </div>
              <div class="form-group">
                <label for="openstack_app_credential_secret">Application credential secret</label>
                <input type="password" class="form-control" id="openstack_app_credential_secret" name="openstack_app_credential_secret">
              </div>
              <div class="form-group">
                <label for="openstack_auth_url">Auth URL</label>
                <input type="text" class="form-control" id="openstack_auth_url" name="openstack_auth_url">
              </div>
              <div class="form-group">
                <label for="openstack_interface">Interface</label>
                <input type="text" class="form-control" id="openstack_interface" name="openstack_interface">
              </div>
              <div class="form-group">
                <label for="openstack_region_name">Region name</label>
                <input type="text" class="form-control" id="openstack_region_name" name="openstack_region_name">
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancel</button>
            <button type="button" class="btn btn-success" id="openstackSaveBtn">Save</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Modal AWS Credentials -->
    <div class="modal fade" id="awsModal" data-backdrop="static" data-keyboard="false" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title d-flex align-items-center">
              <i class="fab fa-aws mr-2"></i>
              AWS credentials
            </h5>
            <button type="button" class="close" data-dismiss="modal">&times;</button>
          </div>
          <div class="modal-body">
            <form id="awsForm">
              <div class="form-group">
                <label for="aws_name">Credential name</label>
                <input type="text" class="form-control" id="aws_name" name="name" placeholder="e.g. aws_creds">
              </div>
              <hr>
              <div class="form-group">
                <label for="aws_access_key_id">Access key ID</label>
                <input type="text" class="form-control" id="aws_access_key_id" name="aws_access_key_id">
              </div>
              <div class="form-group">
                <label for="aws_secret_access_key">Secret access key</label>
                <input type="password" class="form-control" id="aws_secret_access_key" name="aws_secret_access_key">
              </div>
              <div class="form-group">
                <label for="aws_region">Region</label>
                <input type="text" class="form-control" id="aws_region" name="aws_region">
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancel</button>
            <button type="button" class="btn btn-success" id="awsSaveBtn">Save</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Shared Delete confirmation modal -->
    <div class="modal fade" id="deleteModal" data-backdrop="static" data-keyboard="false" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Confirm credentials deletion</h5>
            <button type="button" class="close" data-dismiss="modal">&times;</button>
          </div>
          <div class="modal-body">
            Do you really want to delete these credentials?
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancel</button>
            <button type="button" class="btn btn-danger" id="confirmDeleteBtn">Delete</button>
          </div>
        </div>
      </div>
    </div>

</div>

<script>
$(document).ready(function () {

  var serviceMeta = {
    openstack: {
      icon: '<img src="{{ url_for('static', filename='img/openstack-logo.png') }}" style="width:18px; height:18px; object-fit:contain;" class="mr-2" alt="OpenStack">',
      label: 'OpenStack',
      fields: ['openstack_app_credential_id', 'openstack_app_credential_secret', 'openstack_auth_url', 'openstack_interface', 'openstack_region_name']
    },
    aws: {
      icon: '<i class="fab fa-aws mr-2"></i>',
      label: 'AWS',
      fields: ['aws_access_key_id', 'aws_secret_access_key', 'aws_region']
    }
  };

  function renderTable(entries) {
    var body = $('#credsTableBody');
    body.empty();
    if (!entries || entries.length === 0) {
      body.append('<tr id="emptyRow"><td colspan="3" class="text-center text-muted">No credentials configured yet.</td></tr>');
      return;
    }
    entries.forEach(function (entry) {
      var meta = serviceMeta[entry.service_type] || { icon: '<i class="fas fa-key mr-2"></i>', label: entry.service_type };
      var row = $(
        '<tr>' +
          '<td>' + entry.name + '</td>' +
	  '<td><div class="d-flex align-items-center">' + meta.icon + meta.label + '</div></td>' +
          '<td>' +
            '<button type="button" class="btn btn-sm btn-info editBtn" data-name="' + entry.name + '" data-service-type="' + entry.service_type + '" data-toggle="modal" data-target="#' + entry.service_type + 'Modal"><i class="fas fa-edit"></i> Edit</button> ' +
            '<button type="button" class="btn btn-sm btn-danger deleteBtn" data-name="' + entry.name + '" data-toggle="modal" data-target="#deleteModal"><i class="fas fa-trash"></i> Delete</button>' +
          '</td>' +
        '</tr>'
      );
      body.append(row);
    });
    bindRowEvents();
  }

  function loadList() {
    $.get("{{ url_for('vault_bp.list_service_creds2') }}")
      .done(function (data) { renderTable(data); })
      .fail(function () {
        $('#credsTableBody').html('<tr><td colspan="3" class="text-center text-danger">Error loading credentials list.</td></tr>');
      });
  }

  // Tab on an empty field accepts the suggested (placeholder) value,
  // then focus moves on as usual.
  $(document).on('keydown', '#openstackForm input, #awsForm input', function (e) {
    if (e.key === 'Tab' && !this.value && this.placeholder) {
      this.value = this.placeholder;
    }
  });

  $(document).on('show.bs.modal', '#openstackModal, #awsModal', function (event) {
    var serviceType = this.id.replace('Modal', '');
    var trigger = $(event.relatedTarget);
    var form = $('#' + serviceType + 'Form');
    form[0].reset();
    // Suggested values: shown as grey placeholders, fields stay empty.
    // Pressing Tab on an empty field accepts the suggestion.
    $('#' + serviceType + 'Modal .modal-title span.cloud-ctx').remove();
    var sugg = {};
    if (trigger.hasClass('cloudAddBtn')) {
      sugg = {
        'name':                   trigger.data('suggest-name') || '',
        'openstack_auth_url':     trigger.data('auth-url') || '',
        'openstack_region_name':  trigger.data('region') || ''
      };
      $('#' + serviceType + 'Modal .modal-title').append(
        '<span class="cloud-ctx text-muted small ml-2">— ' + (trigger.data('cloud-label') || '') + '</span>');
    }
    ['name', 'openstack_auth_url', 'openstack_region_name'].forEach(function (f) {
      var inp = form.find('[name="' + f + '"]');
      if (!inp.length) return;
      inp.attr('placeholder', sugg[f] || '')
         .attr('title', sugg[f] ? 'Press Tab to use the suggested value' : '');
    });
    if (trigger.hasClass('editBtn')) {
      var name = trigger.data('name');
      form.find('[name="name"]').val(name).prop('readonly', true);
      $.get("{{ url_for('vault_bp.read_service_creds2') }}", { name: name })
        .done(function (data) {
          serviceMeta[serviceType].fields.forEach(function (fieldName) {
            form.find('[name="' + fieldName + '"]').val(data && data[fieldName] ? data[fieldName] : '');
          });
        });
    } else {
      form.find('[name="name"]').prop('readonly', false);
    }
  });

  function saveCreds(serviceType) {
    var form = $('#' + serviceType + 'Form');
    var payload = form.serializeArray().reduce(function (obj, item) {
      obj[item.name] = item.value;
      return obj;
    }, {});
    if (!payload.name) {
      alert('Please enter a credential name.');
      return;
    }
    if (!/^[A-Za-z0-9_-]+$/.test(payload.name)) {
      alert('Invalid name: use only letters, digits, _ or - (e.g. openstack_garr).');
      return;
    }
    payload['service_type'] = serviceType;
    $.post("{{ url_for('vault_bp.write_service_creds2') }}", payload)
      .done(function () {
        $('#' + serviceType + 'Modal').modal('hide');
        loadList();
      })
      .fail(function () {
        alert('Error saving ' + serviceType + ' credentials.');
      });
  }

  $('#openstackSaveBtn').click(function () { saveCreds('openstack'); });
  $('#awsSaveBtn').click(function () { saveCreds('aws'); });

  var deleteTarget = null;

  function bindRowEvents() {
    $('.deleteBtn').off('click').click(function () {
      deleteTarget = $(this).data('name');
    });
  }

  $('#confirmDeleteBtn').click(function () {
    if (!deleteTarget) return;
    $.ajax({
      url: "{{ url_for('vault_bp.delete_service_creds2') }}" + "?name=" + encodeURIComponent(deleteTarget),
      type: 'DELETE'
    })
    .done(function () { loadList(); })
    .fail(function () { alert('Error deleting credentials.'); })
    .always(function () {
      $('#deleteModal').modal('hide');
      deleteTarget = null;
    });
  });

  loadList();

});

// --- Per-cloud "Add credentials" menu, generated from the admin clouds_json ---
$(function () {
  var OS_LOGO = "{{ url_for('static', filename='img/openstack-logo.png') }}";
  $.get("{{ url_for('laniakea_v399_bp.clouds_all') }}").done(function (clouds) {
    var menu = $('#addCredsMenu').empty();
    (clouds || []).forEach(function (c) {
      var isAws = (c.provider_label || '').toLowerCase() === 'aws';
      var icon = isAws
        ? '<i class="fab fa-aws mr-2"></i>'
        : '<img src="' + OS_LOGO + '" style="width:18px;height:18px;object-fit:contain;" class="mr-2" alt="OpenStack">';
      var item = $('<a class="dropdown-item d-flex align-items-center cloudAddBtn" href="#" data-toggle="modal"></a>')
        .attr('data-target', isAws ? '#awsModal' : '#openstackModal')
        .attr('data-cloud-label', c.display_name)
        .attr('data-suggest-name', isAws ? 'aws_creds' : (c.id || '').replace(/^openstack_/, '') + '_creds')
        .attr('data-auth-url', c.os_auth_url || '')
        .attr('data-region', c.region_name || '')
        .html(icon + c.display_name + ' credentials');
      menu.append(item);
    });
    if (!clouds || clouds.length === 0) {
      menu.append('<span class="dropdown-item text-muted small">No clouds configured</span>');
    }
  }).fail(function () {
    $('#addCredsMenu').html('<span class="dropdown-item text-danger small">Could not load clouds</span>');
  });
});
</script>
{% endblock %}
